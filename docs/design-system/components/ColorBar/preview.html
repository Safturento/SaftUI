<!-- @dsCard group="Controls" height=150 subtitle="A field: the swatch at its left, the code beside it in the normal text color; opaque colours, see-through ones over a checker, light ones, under the mouse, disabled" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ColorBar</title>
</head>
<body>
<div class="sui-stage">
  <div class="sui-stack"><div class="caption sui-state">Opaque</div><div class="sui-colorbar field" style="--swatch: var(--accent)">#00ADF0</div></div>
  <div class="sui-stack"><div class="caption sui-state">Opaque</div><div class="sui-colorbar field" style="--swatch: var(--class-shaman)">#325F96</div></div>
  <div class="sui-stack"><div class="caption sui-state">With opacity</div><div class="sui-colorbar field is-see" style="--swatch: color-mix(in srgb, var(--button-hover) 80%, transparent)">#4D80B3 &middot; 80%</div></div>
  <div class="sui-stack"><div class="caption sui-state">With opacity</div><div class="sui-colorbar field is-see" style="--swatch: color-mix(in srgb, var(--threat-bad) 40%, transparent)">#FF1A1A &middot; 40%</div></div>
  <div class="sui-stack"><div class="caption sui-state">Light</div><div class="sui-colorbar field" style="--swatch: var(--text)">#E6E6CC</div></div>
  <div class="sui-stack"><div class="caption sui-state">Light</div><div class="sui-colorbar field" style="--swatch: var(--text-strong)">#FFFFFF</div></div>
  <div class="sui-stack"><div class="caption sui-state">Hover</div><div class="sui-colorbar field is-hover" style="--swatch: var(--class-mage)">#83BFC9</div></div>
  <div class="sui-stack"><div class="caption sui-state">Disabled</div><div class="sui-colorbar field is-disabled" style="--swatch: var(--class-mage)">#83BFC9</div></div>
</div>
</body>
</html>
