<!-- @dsCard group="Controls" height=96 subtitle="Off, on, under the mouse, disabled" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Toggle</title>
</head>
<body>
<div class="sui-stage">
  <div class="sui-stack"><div class="caption sui-state">Off</div><div class="sui-box sui-check"></div></div>
  <div class="sui-stack"><div class="caption sui-state">On</div><div class="sui-box sui-check is-on"></div></div>
  <div class="sui-stack"><div class="caption sui-state">Hover</div><div class="sui-box sui-check is-hover"></div></div>
  <div class="sui-stack"><div class="caption sui-state">Hover, on</div><div class="sui-box sui-check is-on is-hover"></div></div>
  <div class="sui-stack"><div class="caption sui-state">Disabled</div><div class="sui-box sui-check is-on is-disabled"></div></div>
</div>
</body>
</html>
