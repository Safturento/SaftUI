<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Row</title>
</head>
<body>
<div class="sui-stage">
  <div class="sui-section">
    <div class="section-title">Health</div>
    <div class="sui-panel">
      <div class="sui-line is-quarters">
        <div class="sui-cell"><div class="sui-lab"><div class="sui-label label">Enable</div></div><div class="sui-box sui-check is-on"></div></div>
        <div class="sui-cell"><div class="sui-lab"><div class="sui-label label">Reverse fill</div></div><div class="sui-box sui-check"></div></div>
        <div class="sui-cell"><div class="sui-lab"><div class="sui-label label">Vertical fill</div></div><div class="sui-box sui-check"></div></div>
        <div class="sui-cell"><div class="sui-lab"><div class="sui-label label">Smooth</div></div><div class="sui-box sui-check is-on"></div></div>
      </div>
      <div class="sui-line">
        <div class="sui-cell"><div class="sui-lab"><div class="sui-label label">Texture</div></div><div class="sui-box sui-field field">SaftUI Flat<svg class="sui-ic sui-caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div></div>
        <div class="sui-cell is-disabled"><div class="sui-lab"><div class="sui-label label">Brightness</div></div><div class="sui-range"><div class="sui-track" style="--p: 20%"><i></i><b></b></div><div class="sui-box sui-value field">0.2</div></div></div>
      </div>
      <div class="sui-line is-one">
        <div class="sui-cell"><div class="sui-lab"><div class="sui-label label">Frame level</div></div><div class="sui-range"><div class="sui-track" style="--p: 10%"><i></i><b></b></div><div class="sui-box sui-value field">10</div></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
