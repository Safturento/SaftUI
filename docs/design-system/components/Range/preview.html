<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Range</title>
</head>
<body>
<div class="sui-stage">
  <div class="sui-stack"><div class="caption sui-state">Rest</div><div class="sui-range"><div class="sui-track" style="--p: 50%"><i></i><b></b></div><div class="sui-box sui-value field">45</div></div></div>
  <div class="sui-stack"><div class="caption sui-state">Hover</div><div class="sui-range"><div class="sui-track is-hover" style="--p: 20%"><i></i><b></b></div><div class="sui-box sui-value field">3</div></div></div>
  <div class="sui-stack"><div class="caption sui-state">Percent</div><div class="sui-range"><div class="sui-track" style="--p: 30%"><i></i><b></b></div><div class="sui-box sui-value field">30%</div></div></div>
  <div class="sui-stack"><div class="caption sui-state">Disabled</div><div class="sui-range is-disabled"><div class="sui-track" style="--p: 30%"><i></i><b></b></div><div class="sui-box sui-value field">30%</div></div></div>
</div>
</body>
</html>
